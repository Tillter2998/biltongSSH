apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: biltongssh-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biltongssh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biltongssh
  template:
    metadata:
      labels:
        app: biltongssh
    spec:
      containers:
        - name: biltongssh
          image: biltongssh:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 23234
          readinessProbe:
            tcpSocket:
              port: 23234
          livenessProbe:
            tcpSocket:
              port: 23234
          volumeMounts:
            - name: host-key
              mountPath: /etc/biltongssh
              readOnly: true
      volumes:
        - name: host-key
          secret:
            secretName: biltongssh-host-key
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: biltongssh-data

---
apiVersion: v1
kind: Service
metadata:
  name: biltongssh
spec:
  type: NodePort
  selector:
    app: biltongssh
  ports:
    - port: 23234
      targetPort: 23234
      nodePort: 30234
